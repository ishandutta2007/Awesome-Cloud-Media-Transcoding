<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatPulse{0%{transform:translateY(0) scale(1);opacity:.4}50%{transform:translateY(-12px) scale(1.05);opacity:.8}}@keyframes dashFlow{0%{stroke-dashoffset:100}}@keyframes waveMotion{0%{transform:translateX(0)}50%{transform:translateX(-40px)}}.bg-orb1{animation:floatPulse 6s ease-in-out infinite}.bg-orb2{animation:floatPulse 8s ease-in-out infinite 2s}.flow-line{stroke-dasharray:10,15;animation:dashFlow 3s linear infinite}.wave-path{animation:waveMotion 10s ease-in-out infinite}</style></defs><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><g opacity=".6"><circle cx="200" cy="100" r="140" fill="#38bdf8" class="bg-orb1" filter="url(#glow)" opacity=".3"/><circle cx="1000" cy="300" r="160" fill="#c084fc" class="bg-orb2" filter="url(#glow)" opacity=".3"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 50 100 Q 300 50 600 100 T 1150 100" class="flow-line" opacity=".5"/><path fill="none" stroke="#c084fc" stroke-width="2" d="M 50 300 Q 300 350 600 300 T 1150 300" class="flow-line" opacity=".5"/><path fill="none" stroke="#818cf8" stroke-width="1.5" d="M -50 200 C 150 150 350 250 550 200 C 750 150 950 250 1150 200 C 1350 150 1550 250 1750 200" class="wave-path" opacity=".25"/></g><g text-anchor="middle"><g transform="translate(600, 105)"><path fill="none" stroke="ur